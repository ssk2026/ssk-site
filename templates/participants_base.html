{% extends "base.html" %}

{% block content %}
<style>
    .participants-container {
        width: min(1240px, calc(100% - 52px));
        margin: 0 auto;
        padding: 80px 0 110px;
    }

    .participants-heading {
        position: relative;
        display: flex;
        align-items: center;
        min-height: 56px;
        margin: 0 0 36px;
        padding-left: 20px;
        color: #151932;
        font-size: clamp(32px, 4vw, 46px);
        font-weight: 850;
        letter-spacing: -.05em;
    }

    .participants-heading::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 0;
        width: 6px;
        height: 100%;
        border-radius: 999px;
        background: #f58220;
        transform: translateY(-50%);
    }

    .profile-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px;
    }

    .profile-card {
        display: flex;
        min-height: 270px;
        overflow: hidden;
        border: 1px solid #cdd2e5;
        border-radius: 22px;
        background: #fff;
        transition: transform .3s ease, box-shadow .3s ease, border-color .3s ease;
    }

    .profile-card:hover {
        border-color: #f58220;
        transform: translateY(-5px);
        box-shadow: 0 18px 48px rgba(35, 40, 91, .12);
    }

    .profile-left {
        position: relative;
        width: 200px;
        min-height: 270px;
        flex: 0 0 200px;
        overflow: hidden;
        background: linear-gradient(145deg, #dce6ff, #d8d2ff);
    }

    .profile-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .profile-placeholder {
        display: grid;
        place-items: center;
        color: #242a4e;
        font: 900 28px/1 Arial, sans-serif;
        letter-spacing: .08em;
    }

    .profile-right {
        min-width: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 30px;
    }

    .profile-name {
        margin: 0 0 20px;
        color: #151932;
        font-size: 24px;
        font-weight: 850;
    }

    .profile-info { margin: 0; padding: 0; list-style: none; }
    .info-item { display: flex; align-items: flex-start; margin-bottom: 12px; color: #69708a; font-size: 15px; line-height: 1.5; word-break: keep-all; }
    .info-item:last-child { margin-bottom: 0; }
    .info-item span { width: 82px; flex: 0 0 82px; color: #f58220 !important; font-weight: 800; }
    .info-item div { min-width: 0; overflow-wrap: anywhere; }

    .participants-empty {
        padding: 70px 28px;
        border: 1px solid #dfe4ec;
        border-radius: 22px;
        background: #f8f9fb;
        color: #69708a;
        font-size: 16px;
        text-align: center;
    }

    @media (max-width: 900px) {
        .participants-container { width: min(100% - 36px, 720px); padding: 65px 0 90px; }
        .profile-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 560px) {
        .profile-card { flex-direction: column; }
        .profile-left { width: 100%; min-height: 220px; flex-basis: 220px; }
        .profile-right { padding: 26px 22px; }
    }
</style>

<section class="sub-hero">
    <div class="sub-hero-overlay"></div>
    <div class="sub-hero-content">
        <h1>참여 인력</h1>
    </div>
</section>

<nav class="sub-nav-wrap participants-sub-nav" aria-label="참여 인력 세부 메뉴">
    <ul class="sub-nav-menu">
        <li class="{% if request.resolver_match.url_name == 'participants_organization' %}active{% endif %}">
            <a href="{% url 'participants_organization' %}">조직도</a>
        </li>
        <li class="{% if request.resolver_match.url_name == 'participants_professors' %}active{% endif %}">
            <a href="{% url 'participants_professors' %}">교수진</a>
        </li>
        <li class="{% if request.resolver_match.url_name == 'participants_postdocs' %}active{% endif %}">
            <a href="{% url 'participants_postdocs' %}">박사후연구원</a>
        </li>
        <li class="{% if request.resolver_match.url_name == 'participants_assistants' %}active{% endif %}">
            <a href="{% url 'participants_assistants' %}">연구보조원</a>
        </li>
    </ul>
</nav>

<section class="participants-container">
    <h2 class="participants-heading">{% block participants_title %}{% endblock %}</h2>
    {% block participants_content %}{% endblock %}
</section>
{% endblock %}
